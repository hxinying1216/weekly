server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: weekly-plan-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/weekly_plan?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:122816BXHRLY}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

# 管理员仅由数据库写入；请将账号与 BCrypt 密文配置在部署环境中。
